name: gate
on:
  push:
    branches: [main, codex/bean-counter-v0.11.0-release-20261024]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    uses: stevekkall-beansgc/gate-kit/.github/workflows/compliance.yml@v0.7.7
    with:
      repo: bean-counter
      full: true
      runner: ubuntu-latest
