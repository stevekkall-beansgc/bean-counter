name: setup-native-linux

on:
  push:
    branches:
      - codex/setup-v030-release
      - main

permissions:
  contents: read

concurrency:
  group: setup-native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, resolved from official action tag
        with:
          persist-credentials: false
      - name: Record runner and install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          ldd --version | head -n 1
          python3 --version
          rustup toolchain install 1.98.1 --profile minimal
          rustc --version
          cargo --version
          git rev-parse HEAD
      - name: Build and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$PWD/work/setup-linux/artifacts"
          mkdir -p "$PWD/work/setup-linux"
          sh scripts/package-linux-x86_64.sh "$artifact_dir"
          sha256sum "$artifact_dir"/*
          python3 scripts/verify-native-package.py "$artifact_dir/bean-counter-v0.3.0-x86_64-unknown-linux-gnu.tar.gz" "$artifact_dir/SHA256SUMS" "$(git rev-parse HEAD)"
      - name: Install and exercise packaged product
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$PWD/work/setup-linux/artifacts"
          archive="$(find "$artifact_dir" -maxdepth 1 -type f -name '*x86_64-unknown-linux-gnu.tar.gz' -print -quit)"
          test -n "$archive"
          install_dir="$PWD/work/setup-linux/installed"
          sh scripts/install-linux-x86_64.sh "$archive" "$artifact_dir/SHA256SUMS" "$install_dir"
          file "$install_dir/ledger"
          ldd "$install_dir/ledger"
          python3 scripts/check-guided-billing-setup.py "$install_dir/ledger"
          sh "$install_dir/examples/integration/run-synthetic.sh" "$install_dir/ledger" "$PWD/work/setup-linux/store" "$PWD/work/setup-linux/results"
      - name: Retain tested Linux release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved from official action tag
        with:
          name: bean-counter-v0.3.0-linux-x86_64
          path: work/setup-linux/artifacts/
          if-no-files-found: error
          retention-days: 7
