[package]
name = "ledgerlab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared acceptance facade and concrete stores; Phase 0 scaffold only."

[lints]
workspace = true

[dependencies]
ledgerlab-core.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
serde_json = "=1.0.151"
tempfile = "=3.27.0"
