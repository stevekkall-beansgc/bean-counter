[package]
name = "ledgerlab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared acceptance facade and concrete stores; bounded Phase 1 slice."

[lints]
workspace = true

[features]
zen-charge-candidate = ["ledgerlab-core/zen-charge-candidate"]
# Private process-E2E build only; never enabled by zen-charge-candidate.
zen-charge-e2e-hooks = ["zen-charge-candidate"]

[dependencies]
ledgerlab-core.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }

serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }

tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "=1.0.9", default-features = false }

[dev-dependencies]
ledgerlab-core = { workspace = true, features = ["test-failpoints"] }
ledgerlab-testkit = { path = "../ledgerlab-testkit" }
tempfile = "=3.27.0"
tracing = "=0.1.44"
