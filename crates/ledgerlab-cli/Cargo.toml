[package]
name = "ledgerlab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local SQLite ledger developer CLI."

[lints]
workspace = true

[dependencies]
ledgerlab.workspace = true
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "time", "net"] }

[dev-dependencies]
tempfile = "=3.27.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }

[features]
default = []
http = []

[[bin]]
name = "ledger"
path = "src/main.rs"
