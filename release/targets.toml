contract = "ledgerlab-release-targets/1"
certified = false
cpu_baseline = "generic; target-cpu=native forbidden"
postgres_majors = [17, 18]
sqlite_minimum = "3.51.3"
msrv_status = "unresolved after dependency selection"

[[native]]
triple = "x86_64-unknown-linux-gnu"
status = "production-reference-pending-evidence"
build_reference = "Ubuntu 22.04"
compatibility_reference = "Ubuntu 24.04"
runner = "ubuntu-22.04"
compatibility_runner = "ubuntu-24.04"
artifact = "ledger-v<V>-x86_64-unknown-linux-gnu.tar.gz"
requires = ["native core and SQLite", "PG17/18", "crash/cancellation", "backup/restore/transfer", "inspect linked ABI", "actual archive install and smoke"]

[[native]]
triple = "aarch64-unknown-linux-gnu"
status = "production-reference-pending-evidence"
build_reference = "Ubuntu 22.04"
compatibility_reference = "Ubuntu 24.04"
runner = "ubuntu-22.04-arm"
compatibility_runner = "ubuntu-24.04-arm"
artifact = "ledger-v<V>-aarch64-unknown-linux-gnu.tar.gz"
requires = ["native ARM64; no emulation substitution", "core and SQLite", "PG17/18", "recovery", "inspect linked ABI", "actual archive install and smoke"]

[[native]]
triple = "aarch64-apple-darwin"
status = "local-development-pending-evidence"
build_reference = "macOS 15"
runner = "macos-15"
artifact = "ledger-v<V>-aarch64-apple-darwin.tar.gz"
requires = ["native core and full SQLite", "PG17/18 over TCP", "local HTTP/inspector", "fullfsync verified", "clean-account downloaded archive launch"]
production_host_certified = false
signed_or_notarized_required = false

[[build_only]]
triple = "x86_64-pc-windows-msvc"
reference = "Windows Server 2022"
runner = "windows-2022"
requires = ["all production packages including selected DB/TLS features"]
distributable = false
runtime_certified = false

[oci]
platforms = ["linux/amd64", "linux/arm64"]
base_family = "Debian 12 slim"
base_digests_status = "not selected; must resolve and pin tested digests"
requires = ["one immutable multi-platform index", "native tests of both exact image digests", "non-root", "read-only-root PostgreSQL", "SQLite persistent whole-directory mount restart", "TLS", "probes/shutdown/outbox recovery"]

[other]
source_best_effort = ["other GNU Linux", "macOS 26", "Intel Mac", "Windows ARM64", "Linux musl"]
unsupported_engine = ["32-bit", "big-endian", "browser/WASM", "edge isolates", "request-driven or scale-to-zero functions"]

[evidence]
required = ["three archives", "source plus lockfile/toolchain", "SHA256SUMS", "canonical artifact manifest", "per-artifact SPDX JSON including SQLite/native/base packages", "signed CI provenance with repository/workflow identity", "thin TS SDK contract", "cross-target golden equality", "cross-architecture transfer", "clean onboarding results", "dependency license inventory"]
